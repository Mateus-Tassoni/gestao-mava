# Uso na outra máquina (imagem publicada no Docker Hub + Postgres).
# 1) Copie env.example para .env e ajuste DOCKERHUB_USER e senhas.
# 2) docker login -u SEU_USUARIO_DOCKERHUB   (obrigatório se a imagem for privada)
# 3) docker compose -f docker-compose.prod.yml --env-file .env up -d
# 4) Acesse http://localhost:8080

services:
  postgres:
    image: postgres:16-alpine
    container_name: gestao-mava
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestao_mava}
      POSTGRES_USER: ${POSTGRES_USER:-gestao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestao} -d ${POSTGRES_DB:-gestao_mava}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ${DOCKERHUB_USER}/gestao:latest
    container_name: gestao-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gestao_mava}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-gestao}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gestao_mava}
      POSTGRES_USER: ${POSTGRES_USER:-gestao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: