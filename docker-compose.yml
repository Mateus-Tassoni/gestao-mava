# PostgreSQL para o Sistema de Gestão
# Subir:   docker compose up -d
# Parar:   docker compose down
# Logs:    docker compose logs -f postgres

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gestao-mava
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestao_mava}
      POSTGRES_USER: ${POSTGRES_USER:-gestao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestao123}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: