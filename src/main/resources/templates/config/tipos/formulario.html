<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${tipoEvento.id != null ? 'Portal MAVA | Editar Modelo' : 'Portal MAVA | Novo Modelo'}">Portal MAVA | Novo Modelo</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            /* Paleta MAVA - Light Premium */
            --mava-ouro: #c5a059;
            --mava-ouro-light: #dfc48c;
            --mava-grafite: #111111;
            --mava-bg-light: #f4f6f9;
            --texto-escuro: #2d3436;
            --texto-muted: #636e72;
            --mava-danger: #dc3545;
            --cinza-subtil: #e2e8f0;
        }

        body {
            background-color: var(--mava-bg-light);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            color: var(--texto-escuro);
        }

        /* --- PADRÃO MAVA DE CARDS --- */
        .card-3d {
            background: #ffffff;
            border: 1px solid var(--cinza-subtil);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.04);
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .card-topo-detalhe {
            height: 4px;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: linear-gradient(90deg, transparent, var(--mava-ouro), transparent);
        }

        /* --- PADRÃO MAVA DE FORMULÁRIOS --- */
        .form-label {
            color: var(--mava-grafite);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .input-arredondado {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border: 1px solid var(--cinza-subtil);
            transition: all 0.2s;
            color: var(--texto-escuro);
            background-color: #ffffff;
        }

        .input-arredondado:focus {
            border-color: var(--mava-ouro);
            box-shadow: 0 0 0 0.25rem rgba(197, 160, 89, 0.15);
            outline: none;
        }

        .input-arredondado::placeholder {
            color: #cbd5e1;
            font-weight: 500;
        }

        /* --- CAIXA DE EQUIPES E SWITCHES MAVA --- */
        .box-equipes {
            background: #f8fafc;
            border-radius: 16px;
            border: 1px solid var(--cinza-subtil);
            padding: 1.5rem;
        }

        .form-switch .form-check-input {
            cursor: pointer;
            border-color: #cbd5e1;
        }

        .form-switch .form-check-input:checked {
            background-color: var(--mava-ouro);
            border-color: var(--mava-ouro);
        }

        .form-switch .form-check-input:focus {
            box-shadow: 0 0 0 0.25rem rgba(197, 160, 89, 0.25);
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='-4 -4 8 8'%3e%3ccircle r='3' fill='%23c5a059'/%3e%3c/svg%3e");
        }

        /* --- BOTÕES --- */
        .btn-mava {
            background-color: var(--mava-ouro);
            color: white;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 4px 10px rgba(197, 160, 89, 0.2);
        }

        .btn-cancelar {
            border-radius: 12px;
            font-weight: 600;
            color: var(--texto-muted);
            background: transparent;
            border: 1px solid transparent;
            transition: all 0.2s;
            display: inline-block;
        }

        .hover-scale { transition: transform 0.2s; }

        /* === REGRAS DE HOVER APENAS PARA DESKTOP === */
        @media (hover: hover) and (pointer: fine) {
            .card-3d:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.06); }
            .btn-mava:hover { background-color: #b38f4d; color: white; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(197, 160, 89, 0.3); }
            .btn-cancelar:hover { background-color: #e2e8f0; color: var(--texto-escuro); }
            .hover-scale:hover { transform: scale(1.05); }
        }

        /* --- AJUSTES DE RESPONSIVIDADE PARA MOBILE --- */
        @media (max-width: 576px) {
            .card-body { padding: 1.5rem !important; }
            .box-equipes { padding: 1.2rem !important; }
            .btn-mava, .btn-cancelar { width: 100%; text-align: center; }
        }
        @media (min-width: 576px) {
            .w-sm-auto { width: auto !important; }
        }
    </style>
</head>
<body>

<div class="container mt-4 mt-md-5 mb-4 mb-md-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">

            <div class="mb-3 ps-1">
                <a href="/config/tipos" class="text-decoration-none text-muted fw-bold d-flex align-items-center hover-scale" style="width: fit-content;">
                    <i class="bi bi-arrow-left me-2"></i> Voltar para Modelos
                </a>
            </div>

            <div class="card-3d">
                <div class="card-topo-detalhe"></div>

                <div class="card-body p-4 p-md-5">

                    <div class="d-flex flex-column flex-sm-row align-items-sm-center text-center text-sm-start mb-4 gap-3 gap-sm-0 mt-2">
                        <div class="rounded-circle d-flex align-items-center justify-content-center me-sm-3 shadow-sm mx-auto mx-sm-0 flex-shrink-0" style="width: 55px; height: 55px; background-color: rgba(197, 160, 89, 0.1);">
                            <i class="bi bi-card-list fs-3" style="color: var(--mava-ouro);"></i>
                        </div>
                        <div>
                            <h4 class="mb-0 fw-bold" style="color: var(--mava-grafite); letter-spacing: -0.5px;"
                                th:text="${tipoEvento.id != null ? 'Editar Modelo' : 'Criar Novo Modelo'}">Criar Novo Modelo</h4>
                            <small class="text-muted fw-medium lh-sm d-block mt-1">Configure a estrutura base para os cultos.</small>
                        </div>
                    </div>

                    <hr class="mb-4" style="border-color: var(--cinza-subtil); opacity: 0.5;">

                    <form action="/config/tipos/salvar" method="post" th:object="${tipoEvento}">

                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-4">
                            <label class="form-label">Nome do Modelo <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{nome}" class="form-control input-arredondado fw-medium" placeholder="Ex: Culto de Celebração (Domingo)" required />
                        </div>

                        <div class="mb-4">
                            <label class="form-label d-block mb-2">Equipes Necessárias <span class="text-danger">*</span></label>
                            <p class="text-muted small fw-medium mb-3 lh-sm">Marque as equipes que serão notificadas e convocadas automaticamente ao agendar este modelo.</p>

                            <div class="box-equipes shadow-sm">
                                <div class="row g-3">
                                    <div class="col-12 col-md-6" th:each="min : ${todosMinisterios}">
                                        <div class="form-check form-switch d-flex align-items-center">
                                            <input class="form-check-input fs-5 mt-0 me-2 flex-shrink-0" type="checkbox"
                                                   th:field="*{estruturaPadrao}"
                                                   th:value="${min.id}"
                                                   th:id="${'min_' + min.id}">
                                            <label class="form-check-label fw-medium pt-1 lh-sm" th:for="${'min_' + min.id}"
                                                   th:text="${min.nome}" style="cursor: pointer; color: var(--texto-escuro);">
                                                Nome da Equipe
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <hr class="mt-4 mt-md-5 mb-4" style="border-color: var(--cinza-subtil); opacity: 0.5;">

                        <div class="d-flex flex-column-reverse flex-sm-row justify-content-sm-end gap-2 gap-sm-3">
                            <a href="/config/tipos" class="btn btn-cancelar px-4 py-2 w-100 w-sm-auto text-center">Cancelar</a>
                            <button type="submit" class="btn btn-mava px-4 py-2 w-100 w-sm-auto">
                                <i class="bi bi-save me-2 fs-5 align-middle"></i> Salvar Modelo
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
