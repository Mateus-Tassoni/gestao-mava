<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastro de Ministério | Mava</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
        :root {
            --azul-petroleo: #0c5465;
            --texto-escuro: #2c3e50;
        }

        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        /* --- PADRÃO MANANCIAL DE CARDS --- */
        .card-3d {
            background: #ffffff;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(12, 84, 101, 0.08);
            position: relative;
            overflow: hidden;
        }

        .card-topo-detalhe {
            height: 6px;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: var(--azul-petroleo);
        }

        /* --- PADRÃO MANANCIAL DE FORMULÁRIOS --- */
        .form-label {
            color: var(--texto-escuro);
            font-weight: 700;
            font-size: 0.95rem;
        }

        .input-arredondado {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border: 1px solid #dee2e6;
            transition: all 0.2s;
        }

        .input-arredondado:focus {
            border-color: var(--azul-petroleo);
            box-shadow: 0 0 0 0.25rem rgba(12, 84, 101, 0.15);
            outline: none;
        }

        /* --- BOTÕES --- */
        .btn-manancial {
            background-color: var(--azul-petroleo);
            color: white;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .btn-manancial:hover {
            background-color: #093e4b;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(12, 84, 101, 0.2);
        }

        .btn-cancelar {
            border-radius: 12px;
            font-weight: 600;
            color: #6c757d;
            background: transparent;
            border: 1px solid transparent;
            transition: all 0.2s;
            display: inline-block;
        }

        .btn-cancelar:hover {
            background-color: #e9ecef;
            color: var(--texto-escuro);
        }

        .hover-scale { transition: transform 0.2s; }
        .hover-scale:hover { transform: scale(1.05); }

        /* --- AJUSTES DE RESPONSIVIDADE PARA MOBILE --- */
        @media (max-width: 576px) {
            .card-body { padding: 1.5rem !important; } /* Alivia o padding excessivo no celular */
        }
        @media (min-width: 576px) {
            .w-sm-auto { width: auto !important; }
        }
    </style>
</head>
<body>

<!-- Margens ajustadas para mobile (mt-4 mb-4) -->
<div class="container mt-4 mt-md-5 mb-4 mb-md-5">
    <div class="row justify-content-center">
        <!-- Flexível: Ocupa toda a tela no celular (col-12) -->
        <div class="col-12 col-md-8 col-lg-6">

            <div class="mb-3 ps-1">
                <a href="/equipes" class="text-decoration-none text-muted fw-bold d-flex align-items-center hover-scale" style="width: fit-content;">
                    <i class="bi bi-arrow-left me-2"></i> Voltar para Equipes
                </a>
            </div>

            <div class="card-3d">
                <div class="card-topo-detalhe"></div>

                <div class="card-body p-4 p-md-5">

                    <!-- Flex-column no mobile para empilhar o ícone e o texto -->
                    <div class="d-flex flex-column flex-sm-row align-items-sm-center text-center text-sm-start mb-4 gap-3 gap-sm-0">
                        <div class="bg-light rounded-circle d-flex align-items-center justify-content-center me-sm-3 shadow-sm mx-auto mx-sm-0 flex-shrink-0" style="width: 50px; height: 50px;">
                            <i class="bi bi-diagram-3-fill fs-4" style="color: var(--azul-petroleo);"></i>
                        </div>
                        <div>
                            <h4 class="mb-0 fw-bold" style="color: var(--azul-petroleo); letter-spacing: -0.5px;">Cadastro de Área</h4>
                            <small class="text-muted">Adicione ou edite um ministério da igreja.</small>
                        </div>
                    </div>

                    <hr class="mb-4" style="opacity: 0.1;">

                    <form action="/ministerios/salvar" method="post" th:object="${ministerio}">

                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-4">
                            <label class="form-label">Nome do Ministério <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{nome}" class="form-control input-arredondado fs-6" placeholder="Ex: Departamento Infantil, Louvor, Recepção..." required />
                            <div class="form-text mt-2 lh-sm" style="font-size: 0.85rem;"><i class="bi bi-info-circle me-1"></i> Este nome aparecerá nos relatórios e opções de escala.</div>
                        </div>

                        <hr class="mt-4 mt-md-5 mb-4" style="opacity: 0.1;">

                        <!-- Flex-column-reverse para o botão 'Salvar' ficar por cima e ocuparem a tela toda no celular -->
                        <div class="d-flex flex-column-reverse flex-sm-row justify-content-sm-end gap-2 gap-sm-3">
                            <a href="/equipes" class="btn btn-cancelar px-4 py-2 w-100 w-sm-auto text-center">Cancelar</a>
                            <button type="submit" class="btn btn-manancial px-4 py-2 w-100 w-sm-auto">
                                <i class="bi bi-check-lg me-2"></i> Salvar Área
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
