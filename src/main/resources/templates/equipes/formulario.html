<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Vincular Membro | Mava</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
        :root {
            --azul-petroleo: #0c5465;
            --texto-escuro: #2c3e50;
        }

        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        /* --- PADRÃO MANANCIAL DE CARDS --- */
        .card-3d {
            background: #ffffff;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(12, 84, 101, 0.08);
            position: relative;
            overflow: hidden;
        }

        .card-topo-detalhe {
            height: 6px;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: var(--azul-petroleo);
        }

        /* --- PADRÃO MANANCIAL DE FORMULÁRIOS --- */
        .form-label {
            color: var(--texto-escuro);
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }

        .input-arredondado {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border: 1px solid #dee2e6;
            transition: all 0.2s;
            background-color: #fff;
        }

        .input-arredondado:focus {
            border-color: var(--azul-petroleo);
            box-shadow: 0 0 0 0.25rem rgba(12, 84, 101, 0.15);
            outline: none;
        }

        /* Ajuste específico para selects no padrão moderno */
        select.input-arredondado {
            cursor: pointer;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23343a40' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 16px 12px;
            padding-right: 2.5rem;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        /* --- BOTÕES --- */
        .btn-manancial {
            background-color: var(--azul-petroleo);
            color: white;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-manancial:hover {
            background-color: #093e4b;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(12, 84, 101, 0.2);
        }

        .btn-cancelar {
            border-radius: 12px;
            font-weight: 600;
            color: #6c757d;
            background: transparent;
            border: 1px solid transparent;
            transition: all 0.2s;
            display: inline-block;
        }

        .btn-cancelar:hover {
            background-color: #e9ecef;
            color: var(--texto-escuro);
        }

        /* --- CAIXA DE ALERTA DE REGRA DE NEGÓCIO --- */
        .alert-regra {
            background-color: #fff8e6;
            border: 1px solid #ffeeba;
            border-radius: 10px;
            color: #856404;
            font-size: 0.85rem;
            padding: 0.8rem 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hover-scale { transition: transform 0.2s; }
        .hover-scale:hover { transform: scale(1.05); }

        /* --- AJUSTES DE RESPONSIVIDADE PARA MOBILE --- */
        @media (max-width: 576px) {
            .card-body { padding: 1.5rem !important; } /* Alivia o padding excessivo no celular */
            .alert-regra { align-items: flex-start; } /* Evita que o ícone fique achatado se o texto quebrar em muitas linhas */
            .btn-manancial, .btn-cancelar { width: 100%; text-align: center; } /* Botões 100% de largura */
        }
        @media (min-width: 576px) {
            .w-sm-auto { width: auto !important; }
        }
    </style>
</head>
<body>

<!-- Ajuste nas margens verticais para o mobile não ficar com tanto espaço vazio (mt-4 mb-4) -->
<div class="container mt-4 mt-md-5 mb-4 mb-md-5">
    <div class="row justify-content-center">
        <!-- Flexível: Ocupa toda a tela no celular (col-12) e centraliza bonito no desktop -->
        <div class="col-12 col-md-10 col-lg-9">

            <div class="mb-3 ps-1">
                <a href="/equipes" class="text-decoration-none text-muted fw-bold d-flex align-items-center hover-scale" style="width: fit-content;">
                    <i class="bi bi-arrow-left me-2"></i> Voltar para Equipes
                </a>
            </div>

            <div class="card-3d">
                <div class="card-topo-detalhe"></div>

                <div class="card-body p-4 p-md-5">

                    <!-- Flex-column no mobile para empilhar o ícone e o texto -->
                    <div class="d-flex flex-column flex-sm-row align-items-sm-center text-center text-sm-start mb-4 gap-3 gap-sm-0">
                        <div class="bg-light rounded-circle d-flex align-items-center justify-content-center me-sm-3 shadow-sm mx-auto mx-sm-0 flex-shrink-0" style="width: 50px; height: 50px;">
                            <i class="bi bi-person-plus-fill fs-4" style="color: var(--azul-petroleo);"></i>
                        </div>
                        <div>
                            <h4 class="mb-0 fw-bold" style="color: var(--azul-petroleo); letter-spacing: -0.5px;">Vincular Membro</h4>
                            <small class="text-muted">Adicione uma pessoa à equipe e defina seu nível de acesso.</small>
                        </div>
                    </div>

                    <hr class="mb-4" style="opacity: 0.1;">

                    <form action="/equipes/salvar" method="post" th:object="${equipeMinisterio}">

                        <div class="row g-3 g-md-4">

                            <!-- Classes col-12 adicionadas para garantir empilhamento seguro no mobile -->
                            <div class="col-12 col-md-4">
                                <label class="form-label">Membro <span class="text-danger">*</span></label>
                                <select th:field="*{membro}" class="form-control input-arredondado" required>
                                    <option value="" disabled selected>Selecione a Pessoa...</option>
                                    <option th:each="m : ${membros}" th:value="${m.id}" th:text="${m.nome}"></option>
                                </select>
                            </div>

                            <div class="col-12 col-md-4">
                                <label class="form-label">Ministério / Área <span class="text-danger">*</span></label>
                                <select th:field="*{ministerio}" class="form-control input-arredondado" required>
                                    <option value="" disabled selected>Selecione a Área...</option>
                                    <option th:each="min : ${ministerios}" th:value="${min.id}" th:text="${min.nome}"></option>
                                </select>
                            </div>

                            <div class="col-12 col-md-4">
                                <label class="form-label">Função na Equipe <span class="text-danger">*</span></label>
                                <select th:field="*{funcao}" class="form-control input-arredondado" required>
                                    <option value="VOLUNTARIO">Voluntário</option>
                                    <option value="LIDER">Líder (Notificações)</option>
                                </select>
                            </div>
                        </div>

                        <div class="row mt-4">
                            <div class="col-12">
                                <div class="alert-regra shadow-sm">
                                    <i class="bi bi-whatsapp fs-4 text-success flex-shrink-0"></i>
                                    <div class="lh-sm" style="font-size: 0.85rem;">
                                        <strong>Atenção ao atribuir Líderes:</strong><br>
                                        Apenas os membros marcados como "Líder" receberão as notificações e convocações automáticas via WhatsApp quando esta equipe for escalada.
                                    </div>
                                </div>
                            </div>
                        </div>

                        <hr class="mt-4 mt-md-4 mb-4" style="opacity: 0.1;">

                        <!-- Flex-column-reverse para o botão principal ficar por cima e ocupar a tela toda no celular -->
                        <div class="d-flex flex-column-reverse flex-sm-row justify-content-sm-end gap-2 gap-sm-3">
                            <a href="/equipes" class="btn btn-cancelar px-4 py-2 w-100 w-sm-auto text-center">Cancelar</a>
                            <button type="submit" class="btn btn-manancial px-4 py-2 w-100 w-sm-auto">
                                <i class="bi bi-link-45deg me-2 fs-5 align-middle"></i> Vincular Membro
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
