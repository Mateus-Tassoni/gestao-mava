<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Portal MAVA | Vincular Membro</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            /* Paleta MAVA - Light Premium */
            --mava-ouro: #c5a059;
            --mava-ouro-light: #dfc48c;
            --mava-grafite: #111111;
            --mava-bg-light: #f4f6f9;
            --texto-escuro: #2d3436;
            --texto-muted: #636e72;
            --cinza-subtil: #e2e8f0;
        }

        body {
            background-color: var(--mava-bg-light);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            color: var(--texto-escuro);
        }

        /* --- PADRÃO MAVA DE CARDS --- */
        .card-3d {
            background: #ffffff;
            border: 1px solid var(--cinza-subtil);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.04);
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .card-topo-detalhe {
            height: 4px;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: linear-gradient(90deg, transparent, var(--mava-ouro), transparent);
        }

        /* --- PADRÃO MAVA DE FORMULÁRIOS --- */
        .form-label {
            color: var(--mava-grafite);
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }

        .input-arredondado {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border: 1px solid var(--cinza-subtil);
            transition: all 0.2s;
            color: var(--texto-escuro);
            background-color: #ffffff;
        }

        .input-arredondado:focus {
            border-color: var(--mava-ouro);
            box-shadow: 0 0 0 0.25rem rgba(197, 160, 89, 0.15);
            outline: none;
        }

        select.input-arredondado {
            cursor: pointer;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%232d3436' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 16px 12px;
            padding-right: 2.5rem;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        /* --- BOTÕES --- */
        .btn-mava {
            background-color: var(--mava-ouro);
            color: white;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 4px 10px rgba(197, 160, 89, 0.2);
        }

        .btn-cancelar {
            border-radius: 12px;
            font-weight: 600;
            color: var(--texto-muted);
            background: transparent;
            border: 1px solid transparent;
            transition: all 0.2s;
            display: inline-block;
        }

        /* --- CAIXA DE ALERTA MAVA --- */
        .alert-regra {
            background-color: #f3faf6;
            border: 1px solid #a3cfbb;
            border-radius: 12px;
            color: #125735;
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .hover-scale { transition: transform 0.2s; }

        /* === REGRAS DE HOVER APENAS PARA DESKTOP === */
        @media (hover: hover) and (pointer: fine) {
            .card-3d:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.06); }
            .btn-mava:hover { background-color: #b38f4d; color: white; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(197, 160, 89, 0.3); }
            .btn-cancelar:hover { background-color: #e2e8f0; color: var(--texto-escuro); }
            .hover-scale:hover { transform: scale(1.05); }
        }

        /* --- AJUSTES DE RESPONSIVIDADE PARA MOBILE --- */
        @media (max-width: 576px) {
            .card-body { padding: 1.5rem !important; }
            .alert-regra { align-items: flex-start; }
        }
        @media (min-width: 576px) {
            .w-sm-auto { width: auto !important; }
        }
    </style>
</head>
<body>

<div class="container mt-4 mt-md-5 mb-4 mb-md-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-9">

            <div class="mb-3 ps-1">
                <a href="/equipes" class="text-decoration-none text-muted fw-bold d-flex align-items-center hover-scale" style="width: fit-content;">
                    <i class="bi bi-arrow-left me-2"></i> Voltar para Equipes
                </a>
            </div>

            <div class="card-3d">
                <div class="card-topo-detalhe"></div>

                <div class="card-body p-4 p-md-5">

                    <div class="d-flex flex-column flex-sm-row align-items-sm-center text-center text-sm-start mb-4 gap-3 gap-sm-0 mt-2">
                        <div class="rounded-circle d-flex align-items-center justify-content-center me-sm-3 shadow-sm mx-auto mx-sm-0 flex-shrink-0" style="width: 55px; height: 55px; background-color: rgba(197, 160, 89, 0.1);">
                            <i class="bi bi-person-plus-fill fs-4" style="color: var(--mava-ouro);"></i>
                        </div>
                        <div>
                            <h4 class="mb-0 fw-bold" style="color: var(--mava-grafite); letter-spacing: -0.5px;">Vincular Membro</h4>
                            <small class="text-muted fw-medium">Adicione uma pessoa à equipe e defina seu nível de acesso.</small>
                        </div>
                    </div>

                    <hr class="mb-4" style="border-color: var(--cinza-subtil); opacity: 0.5;">

                    <form action="/equipes/salvar" method="post" th:object="${equipeMinisterio}">

                        <div class="row g-3 g-md-4">
                            <div class="col-12 col-md-4">
                                <label class="form-label">Membro <span class="text-danger">*</span></label>
                                <select th:field="*{membro}" class="form-control input-arredondado fw-medium" required>
                                    <option value="" disabled selected>Selecione a Pessoa...</option>
                                    <option th:each="m : ${membros}" th:value="${m.id}" th:text="${m.nome}"></option>
                                </select>
                            </div>

                            <div class="col-12 col-md-4">
                                <label class="form-label">Ministério / Área <span class="text-danger">*</span></label>
                                <select th:field="*{ministerio}" class="form-control input-arredondado fw-medium" required>
                                    <option value="" disabled selected>Selecione a Área...</option>
                                    <option th:each="min : ${ministerios}" th:value="${min.id}" th:text="${min.nome}"></option>
                                </select>
                            </div>

                            <div class="col-12 col-md-4">
                                <label class="form-label">Função na Equipe <span class="text-danger">*</span></label>
                                <select th:field="*{funcao}" class="form-control input-arredondado fw-medium" required>
                                    <option value="VOLUNTARIO">Voluntário</option>
                                    <option value="LIDER">Líder (Notificações)</option>
                                </select>
                            </div>
                        </div>

                        <div class="row mt-4">
                            <div class="col-12">
                                <div class="alert-regra shadow-sm">
                                    <i class="bi bi-whatsapp fs-3 text-success flex-shrink-0"></i>
                                    <div class="lh-sm" style="font-size: 0.85rem; font-weight: 500;">
                                        <strong>Atenção ao atribuir Líderes:</strong><br>
                                        Apenas os membros marcados como "Líder" receberão as notificações e convocações automáticas via WhatsApp quando esta equipe for escalada.
                                    </div>
                                </div>
                            </div>
                        </div>

                        <hr class="mt-4 mt-md-4 mb-4" style="border-color: var(--cinza-subtil); opacity: 0.5;">

                        <div class="d-flex flex-column-reverse flex-sm-row justify-content-sm-end gap-2 gap-sm-3">
                            <a href="/equipes" class="btn btn-cancelar px-4 py-2 w-100 w-sm-auto text-center">Cancelar</a>
                            <button type="submit" class="btn btn-mava px-4 py-2 w-100 w-sm-auto">
                                <i class="bi bi-link-45deg me-2 fs-5 align-middle"></i> Vincular Membro
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
