<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>Portal MAVA | Selecionar Criança - Mava Kids</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            /* Paleta MAVA - Premium */
            --mava-ouro: #c5a059;
            --mava-ouro-light: #dfc48c;
            --mava-grafite: #111111;
            --texto-escuro: #2d3436;
            --texto-muted: #636e72;
            --mava-danger: #dc3545;
            --cinza-subtil: #e2e8f0;
        }

        /* Fundo imersivo estilo "Totem/App" (MAVA Dark Mode) */
        body {
            background: radial-gradient(circle at center, #2b2b2b 0%, var(--mava-grafite) 60%, #000000 100%);
            font-family: 'Poppins', sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 15px;
        }

        /* Container Principal */
        .card-totem {
            background: #ffffff;
            border: none;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            width: 100%; max-width: 500px;
            padding: 2.5rem 2rem;
            position: relative;
            overflow: hidden;
        }

        .card-topo-detalhe {
            height: 8px; width: 100%; position: absolute; top: 0; left: 0;
            background: linear-gradient(90deg, transparent, var(--mava-ouro), transparent);
        }

        /* Ajustes de espaçamento para Mobile */
        @media (max-width: 576px) {
            .card-totem {
                padding: 1.5rem 1rem;
            }
            .avatar-kids {
                width: 48px; height: 48px;
                font-size: 1.3rem;
            }
        }

        /* --- CARTÕES DAS CRIANÇAS --- */
        .card-filho {
            background-color: #f8fafc;
            border: 1px solid var(--cinza-subtil);
            border-radius: 20px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: default;
        }

        .card-filho:active { transform: scale(0.98); border-color: var(--mava-ouro); }

        .avatar-kids {
            width: 55px; height: 55px;
            background-color: rgba(197, 160, 89, 0.1);
            color: var(--mava-ouro);
            border: 2px solid var(--mava-ouro-light);
            border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            font-size: 1.6rem; font-weight: 800;
            flex-shrink: 0;
        }

        /* --- BOTÕES --- */
        .btn-checkin {
            background-color: var(--mava-ouro);
            color: white; border: none;
            transition: all 0.2s; letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(197, 160, 89, 0.2);
        }
        .btn-checkin:disabled {
            background-color: #cbd5e1; transform: none; box-shadow: none; opacity: 0.8; cursor: not-allowed; color: var(--texto-escuro);
        }

        /* Utilitário customizado para larguras de botão */
        @media (min-width: 576px) {
            .w-sm-auto { width: auto !important; }
        }

        .btn-voltar {
            color: var(--texto-muted);
            font-weight: 600; text-decoration: none;
            padding: 10px 20px; border-radius: 50rem;
            transition: all 0.2s; display: inline-block;
        }

        /* --- ALERTA DE ERRO --- */
        .alerta-totem {
            background-color: #fff5f5; border-left: 4px solid var(--mava-danger);
            border-radius: 12px; color: var(--mava-danger); font-weight: 600;
            padding: 1rem; font-size: 0.95rem; display: none;
            align-items: center; gap: 10px; box-shadow: 0 4px 10px rgba(220, 53, 69, 0.05);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === REGRAS DE HOVER APENAS PARA DESKTOP === */
        @media (hover: hover) and (pointer: fine) {
            .card-filho:hover { border-color: var(--mava-ouro-light); background-color: #ffffff; }
            .btn-checkin:not(:disabled):hover {
                background-color: #b38f4d; transform: translateY(-2px);
                box-shadow: 0 6px 15px rgba(197, 160, 89, 0.3); color: white;
            }
            .btn-voltar:hover { background-color: #f8fafc; color: var(--texto-escuro); }
        }
    </style>
</head>
<body>

<div class="card-totem">
    <div class="card-topo-detalhe"></div>

    <div class="text-center mb-4 mt-2">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3 shadow-sm" style="width: 75px; height: 75px; background-color: rgba(197, 160, 89, 0.1);">
            <i class="bi bi-emoji-smile-fill fs-1" style="color: var(--mava-ouro);"></i>
        </div>
        <h3 class="fw-bold mb-1" style="color: var(--mava-grafite); letter-spacing: -0.5px;">Quem vai entrar?</h3>
        <p class="text-muted fw-medium mb-0">Selecione a criança para registrar a entrada.</p>
    </div>

    <div id="caixaErro" class="alerta-totem mb-4">
        <i class="bi bi-exclamation-triangle-fill fs-5"></i>
        <span id="mensagemErroTexto">Erro ao processar.</span>
    </div>

    <div class="d-grid gap-3 mb-4">

        <div th:each="filho : ${filhos}" class="card-filho p-3 shadow-sm">
            <!-- Flex column no mobile (empilha) e row em telas >= sm (totem) -->
            <div class="d-flex flex-column flex-sm-row align-items-start align-items-sm-center justify-content-between gap-3">

                <!-- Área de Informação (Foto + Nome) -->
                <div class="d-flex align-items-center gap-3 w-100">
                    <!-- Proteção Thymeleaf contra null no substring -->
                    <div class="avatar-kids shadow-sm" th:text="${#strings.isEmpty(filho.nomeCompleto) ? 'K' : #strings.substring(filho.nomeCompleto,0,1)}">A</div>
                    <div>
                        <h5 class="mb-0 fw-bold" style="color: var(--mava-grafite);" th:text="${filho.nomeCompleto}">Ana Clara</h5>
                        <div class="d-flex align-items-center gap-1 mt-1">
                            <span class="badge" style="background-color: #f8fafc; color: var(--texto-muted); border: 1px solid var(--cinza-subtil); font-weight: 600;" th:text="${filho.idade + ' anos'}">5 anos</span>
                        </div>
                    </div>
                </div>

                <!-- Botão toma a largura toda (w-100) no mobile, e largura automática (w-sm-auto) no totem -->
                <button class="btn btn-checkin rounded-pill px-4 py-2 fw-bold w-100 w-sm-auto text-nowrap" th:data-id="${filho.id}">
                    <i class="bi bi-box-arrow-in-right me-1 fs-5 align-middle"></i> Entrar
                </button>
            </div>
        </div>

    </div>

    <div class="mt-4 pt-3 border-top" style="border-color: var(--cinza-subtil) !important;">
        <!-- Flexbox no botão de voltar para evitar que o ícone e texto quebrem feio em telas minúsculas -->
        <a href="/kids/checkin" class="btn-voltar d-flex flex-column flex-sm-row align-items-center justify-content-center gap-2">
            <i class="bi bi-arrow-left-circle-fill fs-5"></i>
            <span>Voltar / Outro telefone</span>
        </a>
    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {

        const botoes = document.querySelectorAll('.btn-checkin');
        const caixaErro = document.getElementById('caixaErro');
        const mensagemErroTexto = document.getElementById('mensagemErroTexto');

        botoes.forEach(botao => {
            botao.addEventListener('click', function() {

                caixaErro.style.display = 'none';

                const idCrianca = this.getAttribute('data-id');
                const btnOriginalText = this.innerHTML;

                this.disabled = true;
                this.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Processando...';

                fetch('/api/kids/confirmar/' + idCrianca, { method: 'POST' })
                .then(response => {
                    if (response.ok) {
                        window.location.href = "/kids/checkin/sucesso";
                    } else {
                        return response.text().then(textoErro => {
                            throw new Error(textoErro || "Erro desconhecido ao realizar check-in.");
                        });
                    }
                })
                .catch(erro => {
                    mensagemErroTexto.innerText = erro.message;
                    caixaErro.style.display = 'flex';

                    this.disabled = false;
                    this.innerHTML = btnOriginalText;
                });

            });
        });

    });
</script>

</body>
</html>
