<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Portal MAVA | Controle de Saída</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            /* Paleta MAVA - Premium */
            --mava-ouro: #c5a059;
            --mava-ouro-light: #dfc48c;
            --mava-grafite: #111111;
            --mava-bg-light: #f4f6f9;
            --texto-escuro: #2d3436;
            --texto-muted: #636e72;
            --mava-danger: #dc3545;
            --mava-success: #198754;
            --cinza-subtil: #e2e8f0;
        }

        body {
            background-color: var(--mava-bg-light);
            font-family: 'Poppins', sans-serif;
            color: var(--texto-escuro);
        }

        /* --- PADRÃO MAVA DE CARDS --- */
        .card-3d {
            background: #ffffff; border: none; border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06); position: relative; overflow: hidden;
            border: 1px solid var(--cinza-subtil);
        }

        .card-topo-detalhe {
            height: 6px; width: 100%; position: absolute; top: 0; left: 0;
            background: var(--mava-danger); /* Vermelho mantido para indicar Saída/Baixa na segurança */
        }

        /* --- INPUT DO LEITOR DE CÓDIGO --- */
        .input-gigante {
            font-size: 3.5rem; text-align: center; font-weight: 800;
            letter-spacing: 8px; border: 2px solid var(--cinza-subtil); border-radius: 20px;
            height: 110px; color: var(--mava-grafite); transition: all 0.3s;
            background-color: #f8fafc;
        }
        .input-gigante:focus {
            border-color: var(--mava-ouro); box-shadow: 0 0 0 0.3rem rgba(197, 160, 89, 0.15);
            background-color: #ffffff; outline: none;
        }
        .input-gigante::placeholder { color: #cbd5e1; font-weight: 600; letter-spacing: 2px; }

        /* --- ESTADO INICIAL DO CARD DA CRIANÇA --- */
        #painelDados { display: none; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- AVATAR E BADGES MAVA --- */
        .avatar-checkout {
            width: 100px; height: 100px; background-color: rgba(197, 160, 89, 0.1); color: var(--mava-ouro);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 3rem; font-weight: 800; margin: 0 auto; border: 4px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        .badge-etiqueta {
            background-color: rgba(197, 160, 89, 0.1); color: var(--mava-ouro);
            font-size: 1.2rem; font-weight: 800; letter-spacing: 2px;
            padding: 0.5rem 1.5rem; border-radius: 50rem;
            border: 2px solid var(--mava-ouro-light);
        }

        .badge-alergia { background-color: #fff5f5; color: var(--mava-danger); border: 1px solid #f5c2c7; padding: 0.5rem 1rem; border-radius: 8px; font-weight: 600; font-size: 0.85rem; display: inline-block; margin: 2px; letter-spacing: 0.5px; }
        .badge-especial { background-color: #fdfaf5; color: #b38f4d; border: 1px solid var(--mava-ouro-light); padding: 0.5rem 1rem; border-radius: 8px; font-weight: 600; font-size: 0.85rem; display: inline-block; margin: 2px; letter-spacing: 0.5px; }

        /* --- BOTÕES E ALERTAS --- */
        .btn-sucesso { background-color: var(--mava-success); color: white; border: none; transition: all 0.2s; letter-spacing: 1px; }
        .btn-sucesso:hover { background-color: #125735; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(25, 135, 84, 0.2); }
        .btn-sucesso:disabled { background-color: #cbd5e1; transform: none; box-shadow: none; opacity: 0.8; color: var(--texto-escuro); cursor: not-allowed; }

        .alert-premium { background-color: #fff5f5; border-left: 4px solid var(--mava-danger); border-radius: 12px; color: var(--mava-danger); font-weight: 600; padding: 1rem; box-shadow: 0 4px 10px rgba(220, 53, 69, 0.05); }

        .alert-sucesso { background-color: #f3faf6; border-left: 4px solid var(--mava-success); border-radius: 16px; color: var(--mava-success); font-weight: 600; padding: 2rem !important; box-shadow: 0 8px 25px rgba(25, 135, 84, 0.1); display: none; text-align: center; font-size: 1.2rem; }

        .hover-scale { transition: transform 0.2s; }
        .hover-scale:hover { transform: scale(1.02); color: var(--mava-grafite) !important; }

        /* --- AJUSTES DE RESPONSIVIDADE PARA MOBILE --- */
        @media (min-width: 576px) {
            .info-divider { border-right: 1px solid var(--cinza-subtil); }
        }
        @media (max-width: 576px) {
            .input-gigante {
                height: 80px;
                font-size: 2.5rem;
                letter-spacing: 4px;
            }
            .card-3d { padding: 1.5rem !important; }
            .avatar-checkout {
                width: 80px; height: 80px;
                font-size: 2.2rem;
            }
            .info-divider {
                border-bottom: 1px solid var(--cinza-subtil);
                padding-bottom: 1rem;
                margin-bottom: 1rem;
            }
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

<div class="container px-3 px-md-0" style="max-width: 600px;">

    <div class="text-center mb-4">
        <div class="d-inline-block rounded-circle p-3 mb-3 shadow-sm" style="color: var(--mava-danger); background-color: #fff5f5; border: 1px solid #f5c2c7;">
            <i class="bi bi-door-open-fill fs-1"></i>
        </div>
        <h2 class="fw-bold mb-1" style="color: var(--mava-grafite); letter-spacing: -1px;">Controle de Saída</h2>
        <p class="text-muted fw-medium">Bipe o QR Code ou digite o número da etiqueta</p>
    </div>

    <div class="card-3d p-4 mb-4">
        <div class="input-group">
            <span class="input-group-text bg-light border-0" style="border-radius: 20px 0 0 20px;">
                <i class="bi bi-upc-scan fs-2 text-muted opacity-50"></i>
            </span>
            <input type="number" id="inputCodigo" class="form-control input-gigante border-start-0" style="border-radius: 0 20px 20px 0;" placeholder="000" autofocus>
        </div>

        <div id="msgErro" class="alert-premium mt-4 d-none">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5 align-middle"></i>
            <span id="textoErro"></span>
        </div>
    </div>

    <div id="msgSucesso" class="alert-sucesso card-3d p-4 mb-4">
        <i class="bi bi-check-circle-fill fs-1 d-block mb-2"></i>
        Criança liberada com sucesso!
    </div>

    <div id="painelDados" class="card-3d mb-4">
        <div class="card-topo-detalhe"></div>

        <div class="card-body p-0">
            <div class="text-center py-4 py-md-5 border-bottom relative" style="background-color: #f8fafc;">
                <div id="avatarLetra" class="avatar-checkout mb-3">A</div>
                <h3 id="txtNome" class="fw-bold m-0 px-2" style="color: var(--mava-grafite);">NOME DA CRIANÇA</h3>
                <div class="mt-3">
                    <span class="badge badge-etiqueta" id="txtCodigo">000</span>
                </div>
            </div>

            <div class="p-4">
                <div class="row text-center mb-4">
                    <div class="col-12 col-sm-6 info-divider">
                        <small class="text-muted text-uppercase fw-bold" style="letter-spacing: 1px;">Responsável</small>
                        <h6 id="txtResponsavel" class="fw-bold mt-1 mb-0" style="color: var(--mava-ouro); font-size: 1.1rem;">Nome do Pai</h6>
                    </div>
                    <div class="col-12 col-sm-6">
                        <small class="text-muted text-uppercase fw-bold" style="letter-spacing: 1px;">Contato</small>
                        <h6 id="txtTelefone" class="fw-bold mt-1 mb-0" style="color: var(--texto-escuro); font-size: 1.1rem;">...</h6>
                    </div>
                </div>

                <div id="boxAlertas" class="text-center mb-4">
                </div>

                <hr style="border-color: var(--cinza-subtil); opacity: 0.5;">

                <div class="d-grid gap-2 mt-4">
                    <button id="btnConfirmar" onclick="confirmarSaida()" class="btn btn-sucesso rounded-pill btn-lg py-3 fw-bold shadow-sm">
                        <i class="bi bi-check2-all me-2 fs-5 align-middle"></i> AUTORIZAR SAÍDA
                    </button>

                    <button onclick="limpar()" class="btn text-muted fw-bold rounded-pill py-2 mt-1 hover-scale" style="background: transparent;">
                        Cancelar e Limpar
                    </button>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    const input = document.getElementById('inputCodigo');
    const msgErro = document.getElementById('msgErro');
    const textoErro = document.getElementById('textoErro');
    const painelDados = document.getElementById('painelDados');
    const msgSucesso = document.getElementById('msgSucesso');
    const btnConfirmar = document.getElementById('btnConfirmar');

    let checkinAtualId = null;

    // Detecta o ENTER (O leitor de código de barras faz isso automaticamente)
    input.addEventListener('keyup', function(e) {
        if (e.key === 'Enter') {
            buscar(this.value);
        }
    });

    async function buscar(codigo) {
        if(!codigo) return;

        try {
            const res = await fetch('/api/checkout/buscar/' + codigo);

            if(res.ok) {
                const checkin = await res.json();
                mostrarDados(checkin);
                msgErro.classList.add('d-none');
            } else {
                const erro = await res.text();
                mostrarErro(erro || "Etiqueta não encontrada no culto de hoje.");
            }
        } catch(e) {
            mostrarErro("Erro de conexão com o servidor.");
        }
    }

    function mostrarDados(c) {
        checkinAtualId = c.id;

        // Atualiza UI
        document.getElementById('txtNome').innerText = c.crianca.nomeCompleto;
        document.getElementById('txtCodigo').innerText = c.codigoEtiqueta;
        document.getElementById('txtResponsavel').innerText = c.responsavel ? c.responsavel.nome : 'Sem vínculo';
        document.getElementById('txtTelefone').innerText = c.responsavel ? c.responsavel.telefone : '---';

        // Pega a primeira letra do nome para o Avatar (Protegido contra nomes nulos vazios)
        let primeiraLetra = 'K';
        if(c.crianca.nomeCompleto && c.crianca.nomeCompleto.length > 0){
            primeiraLetra = c.crianca.nomeCompleto.charAt(0).toUpperCase();
        }
        document.getElementById('avatarLetra').innerText = primeiraLetra;

        // Alertas visuais
        let alertas = '';
        if(c.crianca.alergias && c.crianca.alergias.length > 1) {
            alertas += `<span class="badge-alergia"><i class="bi bi-exclamation-triangle-fill me-1"></i> ALERGIA: ${c.crianca.alergias}</span>`;
        }
        if(c.crianca.necessidadesEspeciais) {
            alertas += `<span class="badge-especial"><i class="bi bi-heart-pulse-fill me-1"></i> CUIDADO ESPECIAL</span>`;
        }
        document.getElementById('boxAlertas').innerHTML = alertas;

        // Exibe o painel
        painelDados.style.display = 'block';
        input.value = '';
        input.blur();
    }

    function mostrarErro(msg) {
        textoErro.innerText = msg;
        msgErro.classList.remove('d-none');
        limparPainel();
    }

    async function confirmarSaida() {
        if(!checkinAtualId) return;

        // Bloqueia o botão e mostra processamento
        const textoOriginal = btnConfirmar.innerHTML;
        btnConfirmar.disabled = true;
        btnConfirmar.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> PROCESSANDO...';

        try {
            const res = await fetch('/api/checkout/confirmar/' + checkinAtualId, { method: 'POST' });

            if(res.ok) {
                // Feedback visual de sucesso premium
                limparPainel();
                msgErro.classList.add('d-none');
                msgSucesso.style.display = 'block';

                // Restaura a tela após 2 segundos
                setTimeout(() => {
                    msgSucesso.style.display = 'none';
                    limpar();
                }, 2000);
            } else {
                const erro = await res.text();
                mostrarErro(erro || "Erro ao registrar a saída.");
            }
        } catch(e) {
            mostrarErro("Erro de comunicação com o servidor.");
        } finally {
            // Libera o botão
            btnConfirmar.disabled = false;
            btnConfirmar.innerHTML = textoOriginal;
        }
    }

    function limpar() {
        limparPainel();
        msgErro.classList.add('d-none');
        input.value = '';
        input.focus();
    }

    function limparPainel() {
        painelDados.style.display = 'none';
        checkinAtualId = null;
    }
</script>

</body>
</html>
