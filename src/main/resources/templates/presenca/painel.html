<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal MAVA | Painel TV - Recepção</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
        /* Paleta MAVA - Dark Premium (TV Mode) */
        --mava-ouro: #c5a059;
        --mava-grafite: #111111;
        --texto-claro: #f8fafc;
    }

    /* Fundo de TV (Kiosk Mode) com efeito Holofote MAVA */
    body {
        background: radial-gradient(circle at center, #2b2b2b 0%, var(--mava-grafite) 60%, #000000 100%);
        color: var(--texto-claro);
        height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: 'Poppins', sans-serif;
    }

    /* --- HEADER (Logo e Relógio) --- */
    .painel-header {
        position: absolute;
        top: 0; left: 0; width: 100%;
        padding: 40px 50px;
        display: flex; justify-content: space-between; align-items: flex-start;
    }

    .logo-tv {
        display: flex; align-items: center; gap: 15px; opacity: 0.9;
    }
    .logo-tv img { width: 60px; height: 60px; filter: drop-shadow(0 0 10px rgba(197, 160, 89, 0.3)); }
    .logo-tv-text { font-size: 1.5rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; line-height: 1.1; color: var(--mava-ouro); }

    .relogio {
        font-size: 3.5rem; font-weight: 300; letter-spacing: 2px;
        text-shadow: 0 4px 15px rgba(0,0,0,0.8); line-height: 1; color: #ffffff;
    }

    /* --- CONTAINER CENTRAL (A Mágica Acontece Aqui) --- */
    .container-tv {
        text-align: center; width: 100%; max-width: 1200px;
        /* Propriedades para a animação via JS */
        transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        opacity: 1; transform: scale(1);
        padding: 0 20px;
    }

    .container-tv.escondido {
        opacity: 0; transform: scale(0.9);
    }

    /* Foto de Destaque Premium */
    .foto-wrapper {
        position: relative; display: inline-block; margin-bottom: 2rem;
    }

    .foto-destaque {
        width: 420px; height: 420px; object-fit: cover; border-radius: 50%;
        border: 10px solid rgba(255, 255, 255, 0.05);
        background-color: var(--mava-grafite);
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        transition: all 0.5s ease;
    }

    /* Tipografia de Apresentação */
    .saudacao {
        font-size: 2rem; font-weight: 600; color: rgba(255,255,255,0.6);
        text-transform: uppercase; letter-spacing: 5px; margin-bottom: 0.5rem;
    }

    .nome-grande {
        font-size: 5.5rem; font-weight: 900; line-height: 1.1; margin-bottom: 1.5rem;
        text-shadow: 0 10px 30px rgba(0,0,0,0.9); text-wrap: balance; color: #ffffff;
    }

    .cargo-grande {
        font-size: 2.2rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 15px;
        background-color: rgba(255,255,255,0.05); padding: 12px 50px; border-radius: 50rem;
        text-transform: uppercase; letter-spacing: 3px; backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        word-break: break-word; max-width: 100%;
    }

    /* --- TEMAS CONDICIONAIS (Controlados pelo JS) --- */
    .tema-membro .foto-destaque {
        border-color: #ffffff;
        box-shadow: 0 0 60px rgba(255, 255, 255, 0.15), 0 20px 50px rgba(0,0,0,0.8);
    }
    .tema-membro .cargo-grande { color: #ffffff; }

    .tema-visitante .foto-destaque {
        border-color: var(--mava-ouro);
        box-shadow: 0 0 80px rgba(197, 160, 89, 0.3), 0 20px 50px rgba(0,0,0,0.8);
    }
    .tema-visitante .saudacao { color: var(--mava-ouro); }
    .tema-visitante .cargo-grande {
        color: var(--mava-ouro); border-color: rgba(197, 160, 89, 0.3);
        background-color: rgba(197, 160, 89, 0.1);
    }

    /* Rodapé de Sistema */
    .marca-dagua {
        position: absolute; bottom: 30px; width: 100%; text-align: center;
        font-size: 1rem; color: rgba(255,255,255,0.2); font-weight: 600; letter-spacing: 3px;
        text-transform: uppercase;
    }

    /* === AJUSTES MOBILE EXCLUSIVOS === */
    @media (max-width: 768px) {
        body { overflow-y: auto; overflow-x: hidden; min-height: 100vh; height: auto; }

        .painel-header {
            position: relative; padding: 20px; flex-direction: column; align-items: center; gap: 10px;
        }

        .logo-tv { justify-content: center; }
        .logo-tv img { width: 45px; height: 45px; }
        .logo-tv-text { font-size: 1.1rem; letter-spacing: 1px; }

        .relogio { font-size: 2.5rem; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }

        .container-tv { padding: 20px 15px; margin-bottom: 60px; }

        .foto-wrapper { margin-bottom: 1.5rem; }
        .foto-destaque { width: 220px; height: 220px; border-width: 6px; }

        .saudacao { font-size: 1.2rem; letter-spacing: 2px; }
        .nome-grande { font-size: 2.5rem; margin-bottom: 1rem; }
        .cargo-grande { font-size: 1.1rem; padding: 10px 25px; letter-spacing: 1px; flex-direction: column; gap: 5px; text-align: center; }

        .marca-dagua { position: relative; bottom: 0; padding: 20px 0; font-size: 0.75rem; letter-spacing: 1px; }
    }

    /* Ajuste intermediário para tablets/telas médias */
    @media (min-width: 769px) and (max-width: 1024px) {
        .foto-destaque { width: 300px; height: 300px; }
        .nome-grande { font-size: 4rem; }
        .cargo-grande { font-size: 1.5rem; }
        .painel-header { padding: 30px; }
    }
  </style>
</head>
<body>

<div class="painel-header">
  <div class="logo-tv">
    <img th:src="@{/img/logo.png}" alt="Logo" onerror="this.style.display='none'">
    <div class="logo-tv-text">MAVA<br></div>
  </div>
  <div class="relogio" id="relogio">--:--</div>
</div>

<div id="cardApresentacao" class="container-tv">

  <div class="saudacao" id="txtSaudacao">Bem-vindo(a)</div>

  <div class="foto-wrapper">
    <img id="imgFoto" th:src="@{/img/logo.png}" class="foto-destaque" onerror="this.src='/img/logo.png'">
  </div>

  <div id="txtNome" class="nome-grande">Aguardando...</div>

  <div id="txtCargo" class="cargo-grande">
    <i id="iconeCargo" class="bi bi-clock-history"></i> <span id="textoCargo">Sistema Pronto</span>
  </div>

</div>

<div class="marca-dagua">SISTEMA DE GESTÃO E RECEPÇÃO | MAVA</div>

<script>
  let ultimoNome = "";
  const FOTO_PADRAO = "/img/logo.png";

  function atualizarPainel() {
      fetch("/api/presenca/placar")
          .then(response => response.json())
          .then(data => {

              if (!data || !data.ultimoNome) return;

              const nome = data.ultimoNome;
              const cargo = data.ultimoCargo;
              const tipo = data.ultimoTipo;
              let fotoUrl = data.fotoUrl;

              if (nome !== ultimoNome) {
                  ultimoNome = nome;

                  const card = document.getElementById("cardApresentacao");

                  card.classList.add("escondido");

                  setTimeout(() => {

                      document.getElementById("txtNome").innerText = nome;
                      document.getElementById("textoCargo").innerText = cargo;

                      const icone = document.getElementById("iconeCargo");
                      const txtSaudacao = document.getElementById("txtSaudacao");

                      if (tipo === 'VISITANTE') {
                          card.className = "container-tv tema-visitante";
                          icone.className = "bi bi-star-fill";
                          txtSaudacao.innerText = "Deus te abençoe,";
                      } else {
                          card.className = "container-tv tema-membro";
                          icone.className = "bi bi-person-vcard-fill";
                          txtSaudacao.innerText = "Bem-vindo(a),";
                      }

                      let fotoFinal = FOTO_PADRAO;
                      if (fotoUrl && fotoUrl !== "null" && fotoUrl.trim() !== "") {
                          if (fotoUrl.startsWith("http") || fotoUrl.startsWith("/")) {
                              fotoFinal = fotoUrl;
                          } else {
                              fotoFinal = "/uploads/" + fotoUrl;
                          }
                      }

                      document.getElementById("imgFoto").src = fotoFinal + "?t=" + new Date().getTime();

                      card.classList.remove("escondido");

                  }, 400);
              }
          })
          .catch(err => console.error("Aguardando conexões..."));
  }

  setInterval(() => {
      const agora = new Date();
      document.getElementById("relogio").innerText = agora.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
  }, 1000);

  setInterval(atualizarPainel, 1500);

  atualizarPainel();
</script>

</body>
</html>
